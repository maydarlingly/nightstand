<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Тумба - Qdesign</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Cormorant+SC:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Экран загрузки, пока рисуются текстуры -->
    <div id="loader">
        <div>
            <span class="loader-emblem">⚜</span>
            <p>Готовим комнату…</p>
        </div>
    </div>

    <!-- Панель управления -->
    <aside id="ui-panel">
        <header class="panel-header">
            <div>
                <h1>Тумба</h1>
                <p class="subtitle">Параметры тумбы</p>
            </div>
            <button id="collapseBtn" class="icon-btn" aria-expanded="true" title="Свернуть панель">–</button>
        </header>
        <div class="divider"><span>❦</span></div>

        <div class="panel-body">
            <section class="group">
                <div class="group-head">
                    <h2>Размеры</h2>
                    <button id="toggleDims" class="chip" aria-pressed="true">Скрыть</button>
                </div>
                <div class="dim-row">
                    <label for="width">Ширина</label>
                    <div class="num"><input type="number" id="width" step="10"><em>мм</em></div>
                    <input type="range" id="width-range" step="10" aria-label="Ширина">
                </div>
                <div class="dim-row">
                    <label for="height">Высота</label>
                    <div class="num"><input type="number" id="height" step="10"><em>мм</em></div>
                    <input type="range" id="height-range" step="10" aria-label="Высота">
                </div>
                <div class="dim-row">
                    <label for="depth">Глубина</label>
                    <div class="num"><input type="number" id="depth" step="10"><em>мм</em></div>
                    <input type="range" id="depth-range" step="10" aria-label="Глубина">
                </div>
            </section>

            <section class="group">
                <h2>Порода дерева</h2>
                <div id="woods" class="woods"></div>
            </section>

            <section class="group">
                <div class="group-head">
                    <h2>Ящик и дверца</h2>
                    <button id="soundBtn" class="chip" aria-pressed="true">🔊 Звук</button>
                </div>
                <div class="actions">
                    <button id="drawerBtn" class="btn">Открыть ящик</button>
                    <button id="doorBtn" class="btn">Открыть дверцу</button>
                </div>
            </section>

            <section class="group">
                <div class="group-head">
                    <h2>Свет</h2>
                    <button id="nightBtn" class="chip">☾ Ночь</button>
                </div>
                <label class="slider-label" for="sunAngle">Направление солнца</label>
                <input type="range" id="sunAngle" min="-60" max="60" value="18">
                <label class="slider-label" for="sunHeight">Высота солнца</label>
                <input type="range" id="sunHeight" min="8" max="70" value="30">
            </section>

            <p class="hint">Вращайте комнату мышью,<br>нажмите на ящик или дверцу, чтобы открыть</p>
        </div>
    </aside>

    <!-- Сюда рисуется 3D-сцена -->
    <div id="canvas-container"></div>

    <!-- Three.js из интернета -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="script.js"></script>
</body>
</html>
